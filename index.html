<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Слова</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Слова">
<meta name="theme-color" content="#2D36D8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --ui: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --word: ui-serif, "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --mark:#FFD43B; --mark-ink:#2B2200;
  --spring:cubic-bezier(.22,1.25,.36,1); --ease:cubic-bezier(.2,.8,.2,1);
}
[data-theme=light]{
  --bg:#EEEFF7; --surface:#FFFFFF; --surface-2:#F3F4FB; --ink:#17183A; --ink-2:#5B5D80; --ink-3:#9799B6;
  --line:rgba(23,24,58,.09); --track:rgba(23,24,58,.08);
  --pen:#2D36D8; --pen-soft:#E2E4FC; --header:#2D36D8;
  --ok:#0E9F6A; --ok-soft:#DBF4E8; --bad:#E5325A; --bad-soft:#FDE1E8;
  --glass:rgba(255,255,255,.84); --glass-line:rgba(255,255,255,.7);
  --shadow:0 1px 0 rgba(23,24,58,.03), 0 14px 30px -20px rgba(45,54,216,.4);
}
[data-theme=dark]{
  --bg:#0E0F22; --surface:#191B38; --surface-2:#22254A; --ink:#EEEFFB; --ink-2:#A7AACD; --ink-3:#6C6F97;
  --line:rgba(255,255,255,.09); --track:rgba(255,255,255,.1);
  --pen:#8089FF; --pen-soft:#272B60; --header:#1A1E6E;
  --ok:#3DD69B; --ok-soft:#12382D; --bad:#FF6B88; --bad-soft:#421828;
  --glass:rgba(30,33,68,.84); --glass-line:rgba(255,255,255,.1);
  --shadow:0 0 0 1px rgba(255,255,255,.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
html{background:var(--header)}
body{position:fixed;inset:0;width:100%;overflow:hidden;-webkit-touch-callout:none;background:var(--header);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit;color:inherit;border:0;outline:0;background:none;-webkit-appearance:none;appearance:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
ul{list-style:none}
svg{display:block}
[data-act]{cursor:pointer}

#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;overflow:clip;background:var(--header)}

/* ---------- views ---------- */
.view{position:absolute;inset:0;overflow-x:hidden;overflow-y:scroll;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:none;background:linear-gradient(to bottom,var(--header) 0 50%,var(--bg) 50% 100%)}
.pg{min-height:calc(100% + 1px);display:flex;flex-direction:column}
.view.on{display:block;animation:viewIn .3s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.head{flex:none;padding:calc(env(safe-area-inset-top) + 20px) 22px 46px;color:#fff;position:relative;background:var(--header)}
.head .sub{font-size:15px;opacity:.78}
.head h1{font-weight:800;font-size:31px;line-height:1.08;letter-spacing:-.025em;margin-top:6px;max-width:15ch}
.body{position:relative;margin-top:-26px;background:var(--bg);border-radius:30px 30px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom) + 124px + var(--kb,0px));flex:1 0 auto}
.streak{position:absolute;right:20px;top:calc(env(safe-area-inset-top) + 20px);display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:999px;padding:7px 13px 7px 10px;font-weight:700;font-size:15px}
.streak.zero{opacity:.6}

/* ---------- shared pieces ---------- */
.tile{background:var(--surface);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.num{font-weight:800;font-size:38px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.cap{color:var(--ink-2);font-size:14px;line-height:1.25;margin-top:6px}
.label{color:var(--ink-2);font-size:14px;font-weight:600;margin:18px 4px 8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:19px;font-weight:700;font-size:18px;transition:transform .18s var(--ease),filter .18s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--pen);color:#fff;box-shadow:0 14px 24px -14px var(--pen)}
[data-theme=dark] .btn.primary{color:#0E0F22}
.btn.soft{background:var(--pen-soft);color:var(--pen)}
.btn.ghost{color:var(--ink-2);min-height:48px;font-size:16px}
.btn.danger{color:var(--bad);min-height:48px;font-size:16px}
.btn.mark{background:var(--mark);color:var(--mark-ink)}

.seg{--i:0;--n:3;position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);background:var(--surface-2);border-radius:15px;padding:4px}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));border-radius:11px;background:var(--surface);box-shadow:0 2px 8px -3px rgba(23,24,58,.3);transform:translateX(calc(var(--i)*100%));transition:transform .38s var(--spring)}
[data-theme=dark] .seg::before{background:var(--pen-soft);box-shadow:none}
.seg button{position:relative;z-index:1;min-height:40px;font-size:14px;font-weight:600;color:var(--ink-2);text-align:center;transition:color .2s;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{color:var(--ink)}
.seg.glass{background:rgba(255,255,255,.16);margin-top:16px}
.seg.glass::before{background:#fff;box-shadow:none}
.seg.glass button{color:rgba(255,255,255,.85);font-size:15px}
.seg.glass button.on{color:#2D36D8}

.ring{flex:none;color:var(--pen)}
.ring .arc{animation:arc 1s var(--ease) .12s forwards}
@keyframes arc{to{stroke-dashoffset:var(--to)}}
.ringbox{position:relative;flex:none;display:grid;place-items:center}
.ringbox>b{position:absolute;font-weight:800;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* ---------- practice home ---------- */
.start{padding:20px}
.start-top{display:flex;align-items:center;gap:16px}
.start-top .t{font-weight:700;font-size:19px;line-height:1.2;letter-spacing:-.01em}
.start .btn{margin-top:16px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.trio .tile{padding:16px 14px;border-radius:22px}
.trio .num{font-size:30px}
.trio .cap{font-size:13px}
.hard{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px}
.hard .t{flex:1}
.hard b{display:block;font-size:17px}
.hard .go{background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:15px;padding:10px 14px;border-radius:14px}
.hint{display:flex;gap:12px;align-items:flex-start;margin-top:12px;background:var(--mark);color:var(--mark-ink);border-radius:22px;padding:14px 16px;font-size:14.5px;line-height:1.35}
.hint b{display:block;font-size:16px;margin-bottom:2px}
.hint button{margin-left:auto;font-weight:800;font-size:20px;line-height:1;padding:2px 4px}

/* ---------- words ---------- */
.search{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.16);border-radius:16px;padding:0 14px;margin-top:16px;height:46px}
.search input{flex:1;height:100%;color:#fff;font-size:17px}
.search input::placeholder{color:rgba(255,255,255,.65)}
.search input::-webkit-search-cancel-button{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;background:var(--surface);color:var(--ink-2);font-weight:600;font-size:14.5px;box-shadow:var(--shadow);transition:background .2s,color .2s}
.chip.on{background:var(--ink);color:var(--bg)}
.list{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:13px 8px 13px 18px;position:relative;width:100%}
.row+.row::before{content:"";position:absolute;left:18px;right:0;top:0;height:1px;background:var(--line)}
.row .w{flex:1;min-width:0}
.row .en{font-family:var(--word);font-weight:700;font-size:20px;letter-spacing:-.01em;line-height:1.2;display:inline;overflow-wrap:anywhere;padding:0 .12em;margin-left:-.12em;border-radius:.22em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.row.learned .en{background:var(--mark);color:var(--mark-ink)}
.row .ru{display:block;color:var(--ink-2);font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:3px;flex:none}
.pips i{width:6px;height:16px;border-radius:3px;background:var(--track)}
.pips i.f{background:var(--pen)}
.row.learned .pips i.f{background:var(--ok)}
.tag-new{flex:none;font-size:12.5px;font-weight:700;color:var(--pen);background:var(--pen-soft);padding:4px 9px;border-radius:999px}
.say{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);transition:transform .15s,color .15s}
.say:active{transform:scale(.85);color:var(--pen)}
.fab{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 94px);width:62px;height:62px;border-radius:22px;background:var(--mark);color:var(--mark-ink);display:grid;place-items:center;box-shadow:0 14px 26px -12px rgba(120,95,0,.7);z-index:5;transition:transform .2s var(--spring)}
.fab:active{transform:scale(.9) rotate(90deg)}
.empty{text-align:center;padding:34px 20px 26px}
.empty .big{font-family:var(--word);font-weight:700;font-size:26px;line-height:1.15;letter-spacing:-.01em}
.empty p{color:var(--ink-2);margin:10px auto 18px;max-width:30ch}
.empty .btn+.btn{margin-top:8px}

/* ---------- stats ---------- */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bento .wide{grid-column:1/-1}
.acc{display:flex;align-items:center;gap:18px}
.acc .ring{color:var(--ok)}
.acc .t b{font-size:19px;display:block;letter-spacing:-.01em}
.legend{display:flex;gap:14px;margin-top:8px;font-size:14px;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;background:var(--ok)}
.legend span.b::before{background:var(--bad)}
.tile h3{font-size:16px;font-weight:700;margin-bottom:12px}
.chart{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:var(--gap,8px);align-items:end}
.col{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.col .bar{height:112px;width:100%;max-width:30px;display:flex;flex-direction:column-reverse;gap:2px;justify-content:flex-start;align-items:stretch}
.col .bar i{display:block;border-radius:6px;background:var(--ok);transform-origin:bottom;animation:grow .7s var(--spring) both;animation-delay:calc(var(--k)*22ms);min-height:3px}
.col .bar i.b{background:var(--bad)}
.col .bar i.z{background:var(--track);height:4px;animation:none}
.col span{font-size:11.5px;color:var(--ink-3);font-weight:600;height:14px;white-space:nowrap}
.col.today span{color:var(--pen);font-weight:800}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.hardlist li{display:flex;align-items:baseline;gap:10px;padding:9px 0}
.hardlist li+li{border-top:1px solid var(--line)}
.hardlist .en{font-family:var(--word);font-weight:700;font-size:18px;min-width:0;max-width:60%;overflow-wrap:anywhere}
.hardlist .ru{flex:1;min-width:0;color:var(--ink-2);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hardlist .x{color:var(--bad);font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dist{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--track)}
.dist i{display:block;min-width:0;transition:flex-grow .7s var(--ease)}
.dist .a{background:var(--ink-3)}.dist .b{background:var(--pen)}.dist .c{background:var(--mark)}
.distkey{display:flex;justify-content:space-between;margin-top:10px;font-size:13.5px;color:var(--ink-2)}
.distkey b{color:var(--ink);font-variant-numeric:tabular-nums}
.none{color:var(--ink-2);font-size:15px}

/* ---------- profile ---------- */
.me{display:flex;align-items:center;gap:16px}
.ava{width:68px;height:68px;border-radius:24px;background:var(--mark);color:var(--mark-ink);display:grid;place-items:center;font-family:var(--word);font-weight:700;font-size:34px;flex:none}
.me h1{margin:0;max-width:none;font-size:27px}
.set{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:6px 18px;margin-bottom:12px}
.set .item{padding:14px 0}
.set .item+.item{border-top:1px solid var(--line)}
.set .item>.t{font-weight:600;font-size:16px;margin-bottom:10px}
.set .line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.set .line .t{font-weight:600}
.set .line small{display:block;color:var(--ink-2);font-size:13.5px;font-weight:400;margin-top:2px}
.sw{position:relative;width:54px;height:32px;border-radius:16px;background:var(--track);flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .32s var(--spring)}
.sw.on{background:var(--ok)}
.sw.on::after{transform:translateX(22px)}
.foot{text-align:center;color:var(--ink-3);font-size:13px;margin-top:18px}

/* ---------- tab bar ---------- */
.tabs{--i:0;position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:10;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border-radius:30px;background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);box-shadow:0 18px 40px -18px rgba(23,24,58,.45);transform:translateZ(0)}
.tabs::before{content:"";position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:24px;background:var(--pen-soft);transform:translateX(calc(var(--i)*100%));transition:transform .45s var(--spring)}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;font-size:11.5px;font-weight:700;color:var(--ink-3);transition:color .2s}
.tabs button svg{transition:transform .35s var(--spring)}
.tabs button.on{color:var(--pen)}
.tabs button.on svg{transform:translateY(-1px) scale(1.08)}

/* ---------- sheets ---------- */
.wrap{position:absolute;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);z-index:30;overflow:hidden;overflow:clip}
.backdrop{position:fixed;inset:0;background:rgba(10,11,35,.5);animation:fade .25s both}
.sheet{position:absolute;left:0;right:0;bottom:-48px;max-height:calc(100% - env(safe-area-inset-top) + 34px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:30px 30px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 66px);animation:up .42s var(--spring) both}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--track);margin:0 auto 14px}
.wrap.out .sheet{animation:down .22s ease-in both}
.wrap.out .backdrop{animation:fade .22s reverse both}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet h2{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.sheet .lead{color:var(--ink-2);font-size:15px;margin-bottom:14px}
.fld{display:block;margin-bottom:10px}
.fld span{display:block;font-size:13.5px;font-weight:600;color:var(--ink-2);margin:0 4px 5px}
.fld input,.fld textarea{display:block;width:100%;background:var(--surface);border-radius:16px;padding:14px 16px;font-size:18px;box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow .2s}
.fld input:focus,.fld textarea:focus{box-shadow:inset 0 0 0 2px var(--pen)}
.fld input.en{font-family:var(--word);font-weight:700;font-size:21px}
.fld textarea{min-height:150px;resize:none;line-height:1.4}
.fld small{display:block;color:var(--ink-3);font-size:13px;margin:5px 4px 0}
.err{color:var(--bad);font-size:14.5px;font-weight:600;margin:0 4px 10px;min-height:0}
.sheet .seg{margin-bottom:14px}
.sheet .btn+.btn{margin-top:6px}
.meta{background:var(--surface);border-radius:16px;padding:12px 16px;font-size:14.5px;color:var(--ink-2);margin-bottom:12px;line-height:1.45}
.meta b{color:var(--ink)}

/* ---------- practice session ---------- */
.session{position:absolute;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);z-index:20;background:var(--header);color:#fff;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 8px);animation:sesIn .4s var(--ease) both}
@keyframes sesIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.s-top{display:flex;align-items:center;gap:12px;padding:4px 16px 8px}
.s-close{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.s-prog{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}
.s-prog i{display:block;height:100%;width:0;border-radius:4px;background:var(--mark);transition:width .6s var(--spring)}
.s-count{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.s-stage{flex:1 1 auto;min-height:130px;max-height:340px;padding:6px 18px 4px;perspective:1100px}
.card{position:relative;height:100%;transform-style:preserve-3d;transition:transform .62s var(--spring)}
.card.flip{transform:rotateY(180deg)}
.s-stage.in{animation:cardIn .42s var(--spring) both}
.s-stage.outa{animation:cardOut .2s ease-in both}
@keyframes cardIn{from{opacity:0;transform:translateY(34px) scale(.92)}to{opacity:1;transform:none}}
@keyframes cardOut{to{opacity:0;transform:translateY(-26px) rotate(-3deg) scale(.96)}}
.face{position:absolute;inset:0;border-radius:30px;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:42px 20px 22px;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 26px 40px -26px rgba(5,8,60,.75);overflow:hidden}
.face.back{transform:rotateY(180deg);justify-content:flex-start;align-items:stretch;padding:14px 16px 16px;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.card.flat{transform:none!important;transform-style:flat;transition:none}
.card.flat .front{display:none}
.card.flat .back{transform:none}
.b-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.back .lang{position:static}
.b-main{margin:auto 0;padding:10px 4px;display:flex;flex-direction:column;align-items:center;text-align:center;flex:none}
.listen{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:9px 16px 9px 12px;border-radius:999px;background:var(--pen-soft);color:var(--pen);font-weight:700;font-size:15.5px;transition:transform .15s}
.listen:active{transform:scale(.93)}
.exs{flex:none;text-align:left}
.exs:empty{display:none}
.session:not(.review) .exs{display:none}
.ex{display:block;width:100%;padding:11px 2px;border-top:1px solid var(--line);text-align:left}
.ex .e{display:block;font-size:17px;line-height:1.3;color:var(--ink);transition:color .15s}
.ex .r{display:block;font-size:14.5px;line-height:1.3;color:var(--ink-2);margin-top:3px}
.ex:active .e{color:var(--pen)}
.ex mark{background:linear-gradient(transparent 58%,var(--mark) 58%);color:inherit;font-weight:700;border-radius:2px;padding:0 1px}
[data-theme=dark] .ex mark{background:none;color:var(--mark)}
.ex-more{display:block;margin:2px auto 0;padding:9px 14px;font-size:14.5px;font-weight:700;color:var(--pen)}
.ex-more:disabled{opacity:.5}
.ex-info{border-top:1px solid var(--line);padding:12px 2px 2px;color:var(--ink-3);font-size:14.5px;text-align:center}
.lang{position:absolute;top:16px;left:18px;font-size:13px;font-weight:700;color:var(--ink-2);background:var(--surface-2);padding:5px 11px;border-radius:999px}
.face .say{position:absolute;top:8px;right:10px;width:44px;height:44px;color:var(--pen)}
.word{font-family:var(--word);font-weight:700;letter-spacing:-.02em;line-height:1.12;overflow-wrap:anywhere;max-width:100%}
.src{color:var(--ink-2);font-size:16px;margin-bottom:10px}
.hl{display:inline;padding:.04em .2em;border-radius:.2em;-webkit-box-decoration-break:clone;box-decoration-break:clone;background:linear-gradient(var(--mark),var(--mark)) no-repeat 0 50%/0% 100%;transition:background-size .5s var(--ease) .32s,color .2s linear .45s}
.card.flip .hl{background-size:100% 100%;color:var(--mark-ink)}
.card.bad .hl{background-image:linear-gradient(var(--bad-soft),var(--bad-soft))}
.card.bad.flip .hl{color:var(--ink)}
.note{color:var(--ink-2);font-size:15px;margin-top:12px;max-width:30ch;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.verdict{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:5px 12px 5px 8px;border-radius:999px;white-space:nowrap}
.card.ok .verdict{background:var(--ok-soft);color:var(--ok)}
.card.bad .verdict{background:var(--bad-soft);color:var(--bad)}
.verdict svg path{stroke-dasharray:24;stroke-dashoffset:24}
.card.flip .verdict svg path{animation:draw .35s ease-out .5s forwards}

.s-fb{min-height:26px;padding:6px 22px 0;font-size:15.5px;font-weight:600;text-align:center;opacity:.92}

.s-form input{flex:1;min-width:0;height:48px;font-size:21px;font-weight:600;color:var(--ink)}
.s-form input::placeholder{color:var(--ink-3);font-weight:500;font-size:17px}

.s-skip{align-self:center;margin-top:6px;padding:10px 18px;font-weight:600;font-size:15.5px;color:rgba(255,255,255,.8)}
.s-next{display:none;width:auto;flex:none;margin:10px 18px 0;min-height:58px}

.sum .ringbox{margin:18px 0 14px}
.sum .ring{color:var(--mark)}
.sum .ringbox>b{font-size:40px}

.sum .acts{align-self:stretch;margin-top:auto;padding-top:18px}
.sum .btn.ghost{color:rgba(255,255,255,.85)}

/* ---------- fx, toast ---------- */
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 14px);z-index:50;transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;padding:11px 18px;border-radius:999px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;transition:transform .45s var(--spring);pointer-events:none}
.toast.on{transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>
</head>
<body>
<div id="app">
  <main id="v-practice" class="view on"></main>
  <main id="v-words" class="view"></main>
  <main id="v-stats" class="view"></main>
  <main id="v-profile" class="view"></main>

  <button class="fab" id="fab" data-act="addWord" aria-label="Добавить слово" hidden></button>

  <nav class="tabs" id="tabs" aria-label="Разделы"></nav>

  <section class="session" id="session" hidden aria-label="Практика"></section>
  <div class="wrap" id="sheet" hidden></div>
  <canvas id="fx"></canvas>
  <div class="toast" id="toast" role="status"></div>
  <label id="hap" for="hapI" aria-hidden="true"><input type="checkbox" switch id="hapI" tabindex="-1"></label>
  <input type="file" id="file" accept="application/json,.json" hidden>
</div>

<script>
(() => {
'use strict';

/* ================= basics ================= */
const KEY = 'slova.v1', DAY = 864e5;
const INTERVALS = [0, 1, 3, 7, 14, 30];   // дни до следующего повторения по уровням
const LEARNED = 3;                          // с этого уровня слово считается выученным
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, a, b, c) => { const d = n % 10, h = n % 100; return d === 1 && h !== 11 ? a : (d >= 2 && d <= 4 && (h < 10 || h >= 20) ? b : c); };
const dayStart = t => { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); };
const dayKey = t => { const d = new Date(t); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const IC = {
  practice: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7" width="13" height="13" rx="3.2"/><path d="M8 3.8h9.2A3.3 3.3 0 0 1 20.5 7v9.2"/></svg>',
  words: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h10.5A3.5 3.5 0 0 1 19 8v11.5H8.2A3.2 3.2 0 0 1 5 16.3z"/><path d="M5 16.3A3.2 3.2 0 0 1 8.2 13H19M9 8.5h6"/></svg>',
  stats: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 20v-6M12 20V5M19 20v-10"/></svg>',
  profile: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.2" r="4"/><path d="M4.5 20c.8-3.6 3.8-5.6 7.5-5.6s6.700 2 7.500 5.600"/></svg>',
  say: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.500l4.500 4v-13l-4.500 4z"/><path d="M15.500 9a4.200 4.200 0 0 1 0 6M18.300 6.200a8.200 8.200 0 0 1 0 11.600"/></svg>',
  plus: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  close: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg>',
  next: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5.500l6.500 6.500L9 18.500"/></svg>',
  search: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.500"/><path d="M16 16l4 4"/></svg>',
  vOk: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg>',
  vBad: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17" pathLength="24"/></svg>',
};

/* ================= state ================= */
function defaults() {
  return {
    v: 1, seq: 1, rev: 0,
    profile: { name: '', createdAt: Date.now(), welcomed: false, hintOff: false },
    settings: { theme: 'auto', dir: 'ru-en', size: 10, goal: 20, voice: true, accent: 'en-US', sound: true },
    words: [], log: [],
  };
}
function migrate(d) {
  const b = defaults();
  d = (d && typeof d === 'object') ? d : {};
  d.v = 1;
  d.profile = { ...b.profile, ...(d.profile || {}) };
  d.settings = { ...b.settings, ...(d.settings || {}) };
  d.words = (Array.isArray(d.words) ? d.words : []).filter(w => w && w.en && w.ru).map(w => ({
    id: String(w.id), en: String(w.en), ru: String(w.ru), note: String(w.note || ''), at: +w.at || Date.now(),
    box: Math.max(0, Math.min(5, +w.box || 0)), due: +w.due || 0, ok: +w.ok || 0, bad: +w.bad || 0, run: +w.run || 0,
    last: +w.last || 0, learnedAt: +w.learnedAt || 0, seen: !!w.seen,
    ex: (Array.isArray(w.ex) ? w.ex : []).filter(x => x && typeof x.e === 'string' && x.e).slice(0, 3).map(x => ({ e: String(x.e), r: String(x.r || '') })),
    exAt: +w.exAt || 0, ms: Math.max(0, +w.ms || 0),
  }));
  d.log = (Array.isArray(d.log) ? d.log : []).filter(e => Array.isArray(e) && e.length >= 3);
  d.seq = Math.max(+d.seq || 1, d.words.length + 1, ...d.words.map(w => (parseInt(w.id, 36) || 0) + 1));
  d.rev = +d.rev || 0;
  return d;
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return migrate(JSON.parse(raw)); } catch (e) {}
  return defaults();
}
let S = load();
// Вторая копия данных в IndexedDB: если одна память очистится, данные вернутся из другой.
const idb = {
  p: null,
  open() {
    return this.p || (this.p = new Promise(res => {
      try {
        const r = indexedDB.open('slova', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result); r.onerror = r.onblocked = () => res(null);
      } catch (e) { res(null); }
    }));
  },
  async set(val) { const db = await this.open(); if (!db) return; try { db.transaction('kv', 'readwrite').objectStore('kv').put(val, 'state'); } catch (e) {} },
  async get() {
    const db = await this.open(); if (!db) return null;
    return new Promise(res => { try { const r = db.transaction('kv').objectStore('kv').get('state'); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); } catch (e) { res(null); } });
  },
};
let idbT = 0;
function save() {
  const cut = Date.now() - 400 * DAY;
  if (S.log.length && S.log[0][0] < cut) S.log = S.log.filter(e => e[0] >= cut);
  S.rev = Date.now();
  const raw = JSON.stringify(S);
  let okLocal = true;
  try { localStorage.setItem(KEY, raw); } catch (e) { okLocal = false; }
  clearTimeout(idbT);
  if (okLocal) idbT = setTimeout(() => idb.set(raw), 300); else idb.set(raw);
}
function flush() { clearTimeout(idbT); idb.set(JSON.stringify(S)); }
const wordById = id => S.words.find(w => w.id === String(id));

/* ================= answer checking ================= */
function norm(s, lang) {
  s = String(s).toLowerCase().replace(/ё/g, 'е').replace(/\([^)]*\)/g, ' ').replace(/[’'`ʼ]/g, '')
    .replace(/[^\p{L}\p{N}]+/gu, ' ').trim().replace(/\s+/g, ' ');
  if (lang === 'en') s = s.replace(/^(to|a|an|the) (?=\S)/, '');
  return s;
}
const variants = t => String(t).split(/[,;\/]|\s+или\s+/).map(x => x.trim()).filter(Boolean);
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 1) return 9;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
function judge(input, card) {
  const lang = card.dir === 'ru-en' ? 'en' : 'ru';
  const want = variants(card.w[lang]).map(v => norm(v, lang)).filter(Boolean);
  const got = norm(input, lang);
  if (!got) return 'empty';
  const raw = card.w[lang], cyr = /[а-яё]/i, lat = /[a-z]/i;
  if (lang === 'en' && cyr.test(input) && !lat.test(input) && !cyr.test(raw)) return 'layout';
  if (lang === 'ru' && lat.test(input) && !cyr.test(input) && !lat.test(raw)) return 'layout';
  if (want.includes(got)) return 'ok';
  if (want.some(v => v.length >= 4 && lev(got, v) === 1)) return 'near';
  return 'bad';
}

/* ================= spaced repetition ================= */
// Быстрый ответ — тот, что дан почти без раздумий: около трёх секунд плюс время на набор букв.
function quickLimit(card) {
  const lang = card.dir === 'ru-en' ? 'en' : 'ru';
  return 3000 + 400 * norm(variants(card.w[lang])[0] || '', lang).length;
}
function grade(card, ok, ms) {
  const w = card.w, now = Date.now();
  S.log.push([now, w.id, ok ? 1 : 0]);
  w.last = now;
  if (ok) {
    w.ok++; w.run++;
    if (ms > 0) w.ms = Math.round(w.ms ? w.ms * .6 + Math.min(ms, 60000) * .4 : Math.min(ms, 60000));
    // Слово, которое уже знакомо и вспоминается сразу, перескакивает через уровень и уходит на более долгий срок.
    const step = ms > 0 && ms < quickLimit(card) && w.box >= 1 ? 2 : 1;
    if (!card.early) { w.box = Math.min(w.box + step, 5); w.due = dayStart(now) + INTERVALS[w.box] * DAY; }
    if (w.box >= LEARNED && !w.learnedAt) w.learnedAt = now;
  } else {
    w.bad++; w.run = 0;
    w.box = w.box >= LEARNED ? 1 : 0;
    w.due = now; w.learnedAt = 0;
  }
  w.seen = true;
  save();
}
function hardWords() {
  return S.words.filter(w => w.bad > 0 && w.box < LEARNED)
    .sort((a, b) => (b.bad / (b.ok + b.bad)) - (a.bad / (a.ok + a.bad)) || b.bad - a.bad);
}
function counts() {
  const now = Date.now(); let due = 0, fresh = 0, learned = 0, learning = 0;
  for (const w of S.words) {
    if (!w.seen) fresh++; else if (w.due <= now) due++;
    if (w.box >= LEARNED) learned++; else if (w.seen) learning++;
  }
  return { due, fresh, learned, learning, total: S.words.length };
}
function buildQueue(mode) {
  const now = Date.now(), size = S.settings.size;
  let pick = [];
  if (mode === 'hard') {
    pick = hardWords().slice(0, size).map(w => ({ w, early: w.seen && w.due > now }));
  } else {
    // Чем ниже уровень, чем больше доля ошибок, чем дольше слово ждёт и чем медленнее оно вспоминается, тем раньше оно попадает в практику.
    const need = w => (5 - w.box) * 2 + w.bad / Math.max(1, w.ok + w.bad) * 4 + Math.min(7, Math.max(0, (now - w.due) / DAY)) * .5 + Math.min(2, w.ms / 8000);
    const due = S.words.filter(w => w.seen && w.due <= now).sort((a, b) => need(b) - need(a) || a.due - b.due);
    const fresh = S.words.filter(w => !w.seen).sort((a, b) => a.at - b.at);
    let nNew = Math.min(fresh.length, Math.max(size - due.length, Math.round(size * .3)));
    const nDue = Math.min(due.length, size - nNew);
    nNew = Math.min(fresh.length, size - nDue);
    pick = [...due.slice(0, nDue), ...fresh.slice(0, nNew)].map(w => ({ w, early: false }));
    if (pick.length < size) {
      const rest = S.words.filter(w => w.seen && w.due > now)
        .sort((a, b) => a.box - b.box || (b.bad - b.ok) - (a.bad - a.ok) || a.last - b.last).slice(0, size - pick.length);
      pick.push(...rest.map(w => ({ w, early: true })));
    }
  }
  const d = S.settings.dir;
  return shuffle(pick).map(p => ({ ...p, dir: d === 'mix' ? (Math.random() < .5 ? 'ru-en' : 'en-ru') : d, first: true, nearUsed: false }));
}

/* ================= stats ================= */
function range(p) {
  const n = new Date(), y = n.getFullYear(), m = n.getMonth(), d = n.getDate();
  if (p === 'day') return [new Date(y, m, d).getTime(), new Date(y, m, d + 1).getTime()];
  if (p === 'week') { const wd = (n.getDay() + 6) % 7; return [new Date(y, m, d - wd).getTime(), new Date(y, m, d - wd + 7).getTime()]; }
  return [new Date(y, m, 1).getTime(), new Date(y, m + 1, 1).getTime()];
}
function periodStats(p) {
  const [a, b] = range(p);
  const ev = S.log.filter(e => e[0] >= a && e[0] < b);
  const ok = ev.filter(e => e[2]).length, bad = ev.length - ok;
  const miss = new Map();
  for (const e of ev) if (!e[2]) miss.set(e[1], (miss.get(e[1]) || 0) + 1);
  const hard = [...miss].map(([id, n]) => ({ w: wordById(id), n })).filter(x => x.w).sort((x, y) => y.n - x.n).slice(0, 5);
  return {
    a, b, ev, ok, bad, total: ev.length, acc: ev.length ? ok / ev.length : 0, hard,
    learned: S.words.filter(w => w.learnedAt >= a && w.learnedAt < b).length,
    added: S.words.filter(w => w.at >= a && w.at < b).length,
  };
}
function streak() {
  const days = new Set(S.log.map(e => dayKey(e[0])));
  let t = dayStart(Date.now()), n = 0;
  if (!days.has(dayKey(t))) t -= DAY;
  while (days.has(dayKey(t + 43200000))) { n++; t = dayStart(t - 43200000); }
  return n;
}

/* ================= sound, voice, haptics, fx ================= */
let actx = null;
function tone(f, at, dur, type = 'sine', vol = .09) {
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + at;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02);
}
function sfx(kind) {
  if (!S.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state !== 'running') actx.resume();
    if (kind === 'ok') { tone(659, 0, .16); tone(988, .09, .28); }
    else if (kind === 'bad') { tone(233, 0, .26, 'triangle', .1); tone(196, .1, .32, 'triangle', .08); }
    else if (kind === 'tick') { tone(784, 0, .12, 'sine', .06); }
    else if (kind === 'fin') { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .1, .42, 'sine', .08)); }
  } catch (e) {}
}
function haptic() { try { $('#hap').click(); } catch (e) {} }

let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices() || []; } catch (e) {} }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.addEventListener?.('voiceschanged', loadVoices); }
function speak(text, force, whole) {
  if (!force && !S.settings.voice) return;
  if (!('speechSynthesis' in window)) { if (force) toast('Озвучка недоступна в этом браузере'); return; }
  try {
    const acc = S.settings.accent, t = whole ? text : (variants(text)[0] || text);
    const u = new SpeechSynthesisUtterance(t.replace(/\([^)]*\)/g, ' '));
    u.lang = acc; u.rate = .92;
    if (!voices.length) loadVoices();
    const fit = voices.filter(v => v.lang.replace('_', '-') === acc);
    const best = fit.find(v => /^(samantha|daniel|ava|kate|serena|allison|zoe|karen|arthur)\b/i.test(v.name));
    if (best) u.voice = best;
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (e) {}
}

const fx = $('#fx'), fctx = fx.getContext('2d');
let parts = [], fxRaf = 0;
function fxSize() { const r = devicePixelRatio || 1; fx.width = fx.clientWidth * r; fx.height = fx.clientHeight * r; fctx.setTransform(r, 0, 0, r, 0, 0); }
function burst(x, y, n, power) {
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  if (!fx.width || fx.width !== Math.round(fx.clientWidth * (devicePixelRatio || 1))) fxSize();
  const cols = ['#FFD43B', '#FFFFFF', '#3DD69B', '#8089FF', '#FF6B88'];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = power * (.35 + Math.random() * .65);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - power * .55, r: 3 + Math.random() * 4, c: cols[i % cols.length], life: 1, rot: Math.random() * 6, vr: (Math.random() - .5) * .5, sq: Math.random() < .55 });
  }
  if (!fxRaf) fxRaf = requestAnimationFrame(fxTick);
}
function fxTick() {
  fctx.clearRect(0, 0, fx.clientWidth, fx.clientHeight);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.vy += .32; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= .014;
    fctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.6)); fctx.fillStyle = p.c;
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.rot);
    if (p.sq) fctx.fillRect(-p.r, -p.r * .6, p.r * 2, p.r * 1.2); else { fctx.beginPath(); fctx.arc(0, 0, p.r * .8, 0, 7); fctx.fill(); }
    fctx.restore();
  }
  fctx.globalAlpha = 1;
  fxRaf = parts.length ? requestAnimationFrame(fxTick) : 0;
  if (!parts.length) fctx.clearRect(0, 0, fx.clientWidth, fx.clientHeight);
}

let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2000); }

function ring(pct, size, stroke) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, h = size / 2;
  pct = Math.max(0, Math.min(1, pct));
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>${pct > 0 ? `<circle class="arc" cx="${h}" cy="${h}" r="${r}" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${c.toFixed(1)}" style="--to:${(c * (1 - pct)).toFixed(1)}" transform="rotate(-90 ${h} ${h})"/>` : ''}</svg>`;
}
function countUp(root) {
  const still = matchMedia('(prefers-reduced-motion:reduce)').matches;
  $$('[data-count]', root).forEach(el => {
    const to = +el.dataset.count, suf = el.dataset.suf || '';
    if (still || to === 0) { el.textContent = to + suf; return; }
    const t0 = performance.now(), dur = 650;
    const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(to * e) + suf; if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function seg(name, opts, val, cls = '') {
  const i = Math.max(0, opts.findIndex(o => o[0] === val));
  return `<div class="seg ${cls}" data-seg="${name}" style="--n:${opts.length};--i:${i}" role="group">${opts.map((o, k) => `<button type="button" data-v="${o[0]}" class="${k === i ? 'on' : ''}">${o[1]}</button>`).join('')}</div>`;
}

function chart(p, st) {
  const days = Math.round((st.b - st.a) / DAY), today = dayKey(Date.now());
  const ok = Array(days).fill(0), bad = Array(days).fill(0);
  const start = new Date(st.a);
  const keys = Array.from({ length: days }, (_, i) => dayKey(new Date(start.getFullYear(), start.getMonth(), start.getDate() + i).getTime()));
  for (const e of st.ev) { const i = keys.indexOf(dayKey(e[0])); if (i >= 0) (e[2] ? ok : bad)[i]++; }
  const max = Math.max(1, ...ok.map((v, i) => v + bad[i]));
  const wd = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
  return `<div class="chart" style="--n:${days};--gap:${p === 'week' ? 10 : 3}px">${keys.map((k, i) => {
    const lab = p === 'week' ? wd[i] : ((i + 1) % 5 === 0 || i === 0 ? i + 1 : '');
    const h = v => `height:${(v / max * 100).toFixed(1)}%`;
    return `<div class="col ${k === today ? 'today' : ''}"><div class="bar" style="--k:${i}">${ok[i] ? `<i style="${h(ok[i])}"></i>` : ''}${bad[i] ? `<i class="b" style="${h(bad[i])}"></i>` : ''}${!ok[i] && !bad[i] ? '<i class="z"></i>' : ''}</div><span>${lab}</span></div>`;
  }).join('')}</div>`;
}

function makeWord(en, ru, note) {
  return { id: (S.seq++).toString(36), en: en.trim(), ru: ru.trim(), note: (note || '').trim(), at: Date.now(), box: 0, due: 0, ok: 0, bad: 0, run: 0, last: 0, learnedAt: 0, seen: false, ex: [], exAt: 0, ms: 0 };
}
const hasWord = (en, skip) => S.words.some(w => w.id !== skip && norm(w.en, 'en') === norm(en, 'en'));
function saveNew() {
  if (!$('#fEn') || !$('#fRu')) return;
  const en = $('#fEn').value, ru = $('#fRu').value, err = $('#fErr');
  if (!norm(en) || !norm(ru)) { err.textContent = 'Заполни слово и перевод'; return; }

// Примеры берутся из открытой базы Tatoeba и сохраняются вместе со словом, поэтому потом работают без интернета.
const EX_RETRY = 14 * DAY;
const exQ = [], exForce = new Set();
let exBusy = false;
function exQuery(en) {
  let t = String(variants(en)[0] || en).toLowerCase().replace(/\([^)]*\)/g, ' ').replace(/[’`ʼ]/g, "'")
    .replace(/[^\p{L}\p{N}' -]+/gu, ' ').replace(/\s+/g, ' ').trim();
  t = t.replace(/^(to|a|an|the) (?=\S)/, '');
  return /[a-z]/.test(t) ? t : '';
}
const exNeeds = w => !w.exAt || (!(w.ex && w.ex.length) && Date.now() - w.exAt > EX_RETRY);
function exPick(rows) {
  const seen = new Set(), all = [];
  for (const s of rows) {
    const e = String((s && s.text) || '').replace(/\s+/g, ' ').trim();
    if (e.length < 8 || e.length > 90) continue;
    const key = e.toLowerCase(); if (seen.has(key)) continue; seen.add(key);
    const tr = [].concat(...(Array.isArray(s.translations) ? s.translations : [])).find(x => x && x.lang === 'rus' && x.text);
    const r = tr ? String(tr.text).replace(/\s+/g, ' ').trim() : '';
    all.push({ e, r: r.length <= 120 ? r : '' });
  }
  all.sort((a, b) => (b.r ? 1 : 0) - (a.r ? 1 : 0) || Math.abs(a.e.length - 38) - Math.abs(b.e.length - 38));
  const out = [], starts = new Set();
  for (const pass of [0, 1]) for (const x of all) {
    if (out.length >= 3) break;
    if (out.includes(x)) continue;
    const st = x.e.toLowerCase().split(' ').slice(0, 2).join(' ');
    if (pass === 0 && starts.has(st)) continue;
    starts.add(st); out.push(x);
  }
  return out;
}
async function exGet(url) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 12000);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (r.status === 400) return [];
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    return Array.isArray(j.data) ? j.data : [];
  } finally { clearTimeout(t); }
}
async function exFetch(en) {
  const q = exQuery(en); if (!q) return [];
  const base = 'https://api.tatoeba.org/v1/sentences?lang=eng&is_unapproved=no&sort=random&limit=14&word_count=3-12&q='
    + encodeURIComponent(q.includes(' ') ? `"${q}"` : q);
  const rows = await exGet(base + '&trans:lang=rus&trans:is_direct=yes&showtrans:lang=rus&showtrans:is_direct=yes');
  let list = exPick(rows);
  if (list.length < 2) list = exPick(rows.concat(await exGet(base + '&showtrans=none')));
  return list;
}
function exWant(w, front) {
  if (!w) return;
  const i = exQ.indexOf(w.id);
  if (i >= 0) { if (!front) return; exQ.splice(i, 1); }
  if (front) exQ.unshift(w.id); else exQ.push(w.id);
  exPump();
}
async function exPump() {
  if (exBusy || !exQ.length || navigator.onLine === false) return;
  exBusy = true;
  const id = exQ.shift(), w = wordById(id), force = exForce.delete(id);
  let net = true;
  if (w && (force || exNeeds(w))) {
    try {
      const list = await exFetch(w.en);
      if (wordById(id) === w) {
        if (list.length || !force) w.ex = list;
        w.exAt = Date.now(); save(); exShow(w);
        if (force && !list.length) toast('Других примеров не нашлось');
      }
    } catch (e) { net = false; exShow(w, true); if (force) toast('Не получилось загрузить примеры'); }
  }
  exBusy = false;
  if (exQ.length) setTimeout(exPump, net ? 700 : 20000);
}
function exFill() {
  let n = 0;
  for (const w of S.words) { if (n >= 40) break; if (exNeeds(w) && !exQ.includes(w.id)) { exQ.push(w.id); n++; } }
  exPump();
}
addEventListener('online', () => exPump());
function markWord(sentence, en) {
  const q = exQuery(en); if (!q) return esc(sentence);
  const toks = q.split(' ').map(t => {
    const safe = x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if (t.length <= 4) return safe(t) + "(?:s|es|ed|ing|'s)?";
    return safe(t.replace(/(ies|ing|ed|e|y|s)$/, '')) + "[\\p{L}']{0,5}";
  });
  let m = null;
  try { m = new RegExp('(^|[^\\p{L}])(' + toks.join('[^\\p{L}]+') + ')(?![\\p{L}])', 'iu').exec(sentence); } catch (e) {}
  if (!m) return esc(sentence);
  const at = m.index + m[1].length;
  return esc(sentence.slice(0, at)) + '<mark>' + esc(m[2]) + '</mark>' + esc(sentence.slice(at + m[2].length));
}
function exShow(w, failed) { if (ses && !ses.finished && ses.phase === 'review' && cur().w === w) renderExamples(w, failed); }
function renderExamples(w, failed) {
  const box = $('#cEx'); if (!box) return;
  if (w.ex && w.ex.length) {
    box.innerHTML = w.ex.map((x, i) => `<button type="button" class="ex" data-act="sayEx" data-i="${i}"><span class="e">${markWord(x.e, w.en)}</span>${x.r ? `<span class="r">${esc(x.r)}</span>` : ''}</button>`).join('')
      + '<button type="button" class="ex-more" data-act="moreEx">Другие примеры</button>';
  } else if (!exQuery(w.en)) box.innerHTML = '';
  else if (failed || navigator.onLine === false) box.innerHTML = '<p class="ex-info">Примеры появятся, когда будет интернет</p>';
  else if (!exNeeds(w)) box.innerHTML = '<p class="ex-info">Для этого слова примеров не нашлось</p>';
  else { box.innerHTML = '<p class="ex-info">Ищу примеры…</p>'; exWant(w, true); }
}

function vv() {

const SCROLLERS = '.view,.sheet,.sum,.chips,.face.back,textarea';

}, { passive: false });
